[project]
name = "so101-vlm-pickplace"
version = "0.1.0"
description = "SO-101 を VLM で動かす pick-and-place（MuJoCo シミュレーション）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "mujoco",
    "numpy",
    "pillow",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]
# dora-rs のデータフロー (dataflow.yml) を動かすときだけ: uv sync --group dataflow (ADR 0001。講義と同じ 1.0.1)
dataflow = [
    "dora-rs-cli==1.0.1",
    "dora-rs==1.0.1",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_vlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["so101_vlm"]

[tool.coverage.report]
show_missing = true
