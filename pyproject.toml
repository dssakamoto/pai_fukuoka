[project]
name = "so101-vlm-pickplace"
version = "0.1.0"
description = "SO-101 を VLM で動かす pick-and-place（MuJoCo シミュレーション）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "mujoco",
    "numpy",
    "pillow",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]
# dora-rs のデータフロー (dataflow.yml) を動かすときだけ: uv sync --group dataflow (ADR 0001。講義と同じ 1.0.1)
dataflow = [
    "dora-rs-cli==1.0.1",
    "dora-rs==1.0.1",
    "pyarrow",
]
# LeRobot 形式での記録 (TASK-0027)。torch を含む重い依存なので、記録・読み込みを確かめるときだけ: uv sync --group record
record = [
    "lerobot[dataset]==0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_vlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: 印の綴り間違いを黙って通さない。
addopts = "--strict-markers"
markers = [
    "render: MuJoCo のオフスクリーン描画 (OpenGL) が要る。GPU・ディスプレイのない CI では `-m \"not render\"` で除く",
    "api: 実際の VLM API (キーとネットワークが要る)。CI では `-m \"not api\"` で除く。キーがなければテスト側でスキップする",
]

[tool.coverage.run]
source = ["so101_vlm"]
# dora の子プロセスとして動くため、測定に載らない (動作は tests/nodes/test_nodes_dora_run.py が実際に dora run で確かめる)
omit = ["src/so101_vlm/nodes/run.py", "src/so101_vlm/nodes/dora_runtime.py"]

[tool.coverage.report]
show_missing = true
# AC-07: 対象ロジックのカバレッジ 80% 以上。CI (描画なし) でも、これを下回ったら失敗にする
fail_under = 80
